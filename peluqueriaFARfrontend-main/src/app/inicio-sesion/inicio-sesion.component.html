<div class="container-fluid px-4 px-lg-5 d-flex justify-content-center align-items-center vh-100">
  <div class="auth-card shadow-sm border rounded-3 bg-white" style="max-width: 820px; width: 100%;">
    
    <div class="p-5">
      <h2 class="fw-bold mb-4" style="color: #333;">Iniciar Sesión</h2>
      
      <p class="text-muted mb-3" style="font-size: 0.85rem;">Accede a tu cuenta de peluquería</p>

      <!-- Mensaje de éxito -->
      <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
        {{ successMessage }}
        <button type="button" class="btn-close" (click)="successMessage = ''"></button>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
      </div>

      <form (ngSubmit)="loginWithEmail()">
        <div class="input-group mb-3">
          <span class="input-group-text bg-white border-end-0 text-muted">
            📧
          </span>
          <input 
            type="email" 
            class="form-control border-start-0 ps-0" 
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required>
        </div>

        <div class="input-group mb-4">
          <span class="input-group-text bg-white border-end-0 text-muted">
            🔒
          </span>
          <input 
            type="password" 
            class="form-control border-start-0 ps-0" 
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            required>
        </div>

        <button 
          type="submit" 
          class="btn w-100 py-3 text-white fs-6 fw-medium mb-4" 
          style="background-color: #d17871; border: none; border-radius: 6px;"
          [disabled]="loading">
          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Cargando...
          </span>
        </button>
      </form>

      <div class="d-flex align-items-center mb-4">
        <hr class="flex-grow-1 border-secondary opacity-25">
        <span class="mx-3 text-muted fs-6 fw-semibold">O inicia sesion con</span>
        <hr class="flex-grow-1 border-secondary opacity-25">
      </div>

      <div class="d-flex justify-content-center mb-4">
        <button 
          type="button" 
          class="btn btn-outline-secondary w-100 py-3 fs-6 fw-medium d-flex align-items-center justify-content-center"
          (click)="loginWithGoogle()"
          [disabled]="loading"
          style="border-radius: 6px;">
          <svg width="18" height="18" class="me-3" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span *ngIf="!loading">Iniciar sesión con Google</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Cargando...
          </span>
        </button>
      </div>

      <hr class="mt-4 mb-4 border-secondary opacity-25">

      <div class="text-center mt-3">
        <span class="text-muted fs-6">¿No tienes cuenta? </span>
        <a routerLink="/registro" class="text-decoration-none fw-bold fs-6" style="color: #6d9cc1;">Regístrate ></a>
      </div>
    </div>
  </div>
</div>
