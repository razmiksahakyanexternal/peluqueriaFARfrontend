app.google.client-id=251641039207-pn6domeb2218q3rkbj95lk0gfrcq2e9q.apps.googleusercontent.com
app.google.client-secret=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
app.google.redirect-uri=http://localhost:8081/auth/google/callback
app.frontend.url=http://localhost:4200
