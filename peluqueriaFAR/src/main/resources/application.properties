spring.application.name=peluqueriaFAR

# Server port (to avoid conflict with phpMyAdmin on 8080)
server.port=8081

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/peluqueriaFAR?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=peluqueria
spring.datasource.password=peluqueria

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

