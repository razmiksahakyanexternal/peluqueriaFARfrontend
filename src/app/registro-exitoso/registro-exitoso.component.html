<div class="container-fluid px-4 px-lg-5 d-flex justify-content-center align-items-center vh-100">
  <div class="auth-card shadow-sm border rounded-3 bg-white" style="max-width: 820px; width: 100%;">
    <div class="p-5 text-center">
      <h2 class="fw-bold mb-4" style="color: #333;">Cuenta creada</h2>

      <p class="text-muted mb-3" style="font-size: 0.95rem;">{{ message }}</p>
      <p class="mb-4">
        Para poder iniciar sesion, abre el enlace de verificacion que te ha llegado por correo. Si no aparece, revisa
        SPAM/No deseado y espera unos minutos.
      </p>

      <button
        type="button"
        class="btn w-100 py-3 text-white fs-6 fw-medium mb-3"
        style="background-color: #d17871; border: none; border-radius: 6px;"
        [disabled]="!email || resendLoading"
        (click)="resendVerificationEmail()"
      >
        {{ resendLoading ? 'Reenviando...' : 'Reenviar correo de verificacion' }}
      </button>

      <p class="text-success mb-3" *ngIf="resendMessage">{{ resendMessage }}</p>
      <p class="text-danger mb-3" *ngIf="resendError">{{ resendError }}</p>

      <a
        routerLink="/inicio-sesion"
        class="btn w-100 py-3 text-white fs-6 fw-medium"
        style="background-color: #d17871; border: none; border-radius: 6px;"
      >
        Ir a iniciar sesion
      </a>
    </div>
  </div>
</div>
