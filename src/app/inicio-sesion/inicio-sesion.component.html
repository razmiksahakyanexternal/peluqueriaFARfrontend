<div class="container-fluid px-4 px-lg-5 d-flex justify-content-center align-items-center vh-100">
  <div class="auth-card shadow-sm border rounded-3 bg-white" style="max-width: 820px; width: 100%;">
    <div class="p-5">
      <h2 class="fw-bold mb-4" style="color: #333;">Iniciar Sesión</h2>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
        <label class="d-block mb-2" style="font-size: 0.9rem;">
          Email
          <span [style.color]="(submitted || emailModel.touched) && emailModel.invalid ? '#dc3545' : '#6c757d'">*</span>
        </label>
        <div class="input-group mb-1">
          <input
            type="email"
            class="form-control"
            placeholder="Email"
            name="email"
            ngModel
            required
            email
            #emailModel="ngModel"
            [class.is-invalid]="(submitted || emailModel.touched) && emailModel.invalid">
        </div>
        <div class="text-danger small mt-1" *ngIf="(submitted || emailModel.touched) && emailModel.errors?.['required']">
          El email es obligatorio.
        </div>
        <div class="text-danger small mt-1" *ngIf="(submitted || emailModel.touched) && emailModel.errors?.['email']">
          Formato de email no válido.
        </div>

        <label class="d-block mb-2 mt-3" style="font-size: 0.9rem;">
          Contraseña
          <span [style.color]="(submitted || passwordModel.touched) && passwordModel.invalid ? '#dc3545' : '#6c757d'">*</span>
        </label>
        <div class="mb-3">
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              placeholder="Contraseña"
              name="password"
              ngModel
              required
              minlength="4"
              pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*]).+$"
              #passwordModel="ngModel"
              [class.is-invalid]="(submitted || passwordModel.touched) && passwordModel.invalid">
          </div>

          <div class="text-danger small mt-1"
              *ngIf="(submitted || passwordModel.touched) && passwordModel.errors?.['required']">
            La contraseña es obligatoria.
          </div>

          <div class="text-danger small mt-1 mb-4"
              *ngIf="(submitted || passwordModel.touched) && passwordModel.errors?.['pattern']">
            La contraseña debe contener al menos una letra, un número y un carácter especial.
          </div>
        </div>

        <button type="submit" class="btn w-100 py-3 text-white fs-6 fw-medium mb-4"
                [disabled]="emailModel.invalid || passwordModel.errors?.['required']"
                style="background-color: #d17871; border: none; border-radius: 6px;">
          Iniciar Sesión
        </button>

        <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="text-success" *ngIf="successMessage">{{ successMessage }}</p>

        <div class="d-flex align-items-center mb-4">
          <hr class="flex-grow-1 border-secondary opacity-25">
          <span class="mx-3 text-muted fs-6 fw-semibold">O inicia sesión con</span>
          <hr class="flex-grow-1 border-secondary opacity-25">
        </div>

        <div class="d-flex justify-content-center">
          <button type="button" class="btn btn-outline-light border shadow-sm px-5 py-3 d-flex align-items-center text-dark bg-white fs-5 justify-content-center w-auto" (click)="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="26" class="me-2">
            Iniciar sesión con Google
          </button>
        </div>

        <hr class="mt-4 mb-4 border-secondary opacity-25">

        <div class="text-center mt-3">
          <span class="text-muted fs-6">¿No tienes cuenta? </span>
          <a routerLink="/registro" class="text-decoration-none fw-bold fs-6" style="color: #6d9cc1;">Registrate ></a>
        </div>
      </form>
    </div>
  </div>
</div>
