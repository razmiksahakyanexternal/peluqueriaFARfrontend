<div class="home-page">
  <section class="home-card">
    <div class="hero-overlay">
      <nav class="top-nav">
        <div class="brand">Peluquería FAR</div>
        <div class="nav-actions">
          <span class="welcome-message">Bienvenido, {{ userName }}</span>
          <button type="button" class="login-btn nav-logout-btn" (click)="logout()">Cerrar Sesion</button>
        </div>
      </nav>

      <div class="hero-content">
        <h1>Peluquería FAR</h1>
        <p>Reserva tu cita fácilmente online</p>
        <div class="cta-row">
          <button type="button" class="btn-book" (click)="reservarCita()">Reservar Cita</button>
          <button type="button" class="btn-login btn-appointments" (click)="verMisCitas()">Ver mis Citas</button>
        </div>
      </div>
    </div>

    <div class="bottom-copy">
      <p>Reserva con nosotros y disfruta de un servicio profesional y personalizado.</p>
    </div>
  </section>
</div>
